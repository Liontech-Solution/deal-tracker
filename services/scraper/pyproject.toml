[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-tracker-scraper"
version = "0.1.0"
description = "Servicio de scraping e ingesta de precios (deal-tracker)"
requires-python = ">=3.12"
dependencies = [
    # Techo a propósito: `scraper/tls.py` se apoya en que httpcore llame a `set_alpn_protocols()`
    # sobre el contexto que recibe, que es un detalle INTERNO (verificado en httpcore 1.0.9, que es
    # lo que arrastra httpx 0.28). Si deja de hacerlo, dejamos de anunciar ALPN... o volvemos a
    # anunciarlo en silencio, y el síntoma es un 429 que parece otra cosa. El techo no arregla eso
    # —de eso se encarga el vigía (#67)—, pero obliga a que el bump sea un PR donde re-verificarlo.
    "httpx>=0.27,<0.29",
    # `scraper/tls.py` lo usa directo para armar el contexto TLS con los mismos CA que httpx.
    # Llega de todas formas como dependencia transitiva de httpx, pero eso es una casualidad, no
    # un contrato: si httpx dejara de necesitarlo, el CronJob de Cacles reventaría al arrancar.
    "certifi",
    "psycopg[binary]>=3.2",
    # Navegador headless para tiendas tras anti-bot (Akamai): ejecuta el sensor JS y obtiene
    # cookies válidas. Solo lo usan las tiendas que lo necesitan (Sfera e Hipercor); el binario de
    # Chromium NO viene en el paquete, se instala aparte (`playwright install chromium`, que es lo
    # que hace `just setup`; en la imagen lo hace el Dockerfile).
    #
    # Techo a propósito, con el mismo argumento que el de httpx: cada versión mayor de Playwright
    # trae OTRO build de Chromium, y las dos tiendas que lo usan están tras Akamai, que identifica
    # al navegador por su huella. El techo no impide que la huella cambie —de eso avisa el vigía
    # (#67)—, obliga a que el bump sea un PR donde toque re-verificarlo con `scraper.vigia`.
    # Y de paso arregla la fricción local que abrió #91: los navegadores viven en
    # `~/.cache/ms-playwright`, FUERA del venv y compartidos entre ellos, así que sin techo un venv
    # nuevo pide un build que nadie ha descargado (medido el 02/08/2026: la 1.62 busca
    # `chromium-1234` y lo cacheado era el `chromium-1228` de la 1.61).
    "playwright>=1.49,<1.62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
scraper = "scraper.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scraper"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
