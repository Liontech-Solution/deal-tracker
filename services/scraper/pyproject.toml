[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-tracker-scraper"
version = "0.1.0"
description = "Servicio de scraping e ingesta de precios (deal-tracker)"
requires-python = ">=3.12"
dependencies = [
    # Techo a propósito: `scraper/tls.py` se apoya en que httpcore llame a `set_alpn_protocols()`
    # sobre el contexto que recibe, que es un detalle INTERNO (verificado en httpcore 1.0.9, que es
    # lo que arrastra httpx 0.28). Si deja de hacerlo, dejamos de anunciar ALPN... o volvemos a
    # anunciarlo en silencio, y el síntoma es un 429 que parece otra cosa. El techo no arregla eso
    # —de eso se encarga el vigía (#67)—, pero obliga a que el bump sea un PR donde re-verificarlo.
    "httpx>=0.27,<0.29",
    # `scraper/tls.py` lo usa directo para armar el contexto TLS con los mismos CA que httpx.
    # Llega de todas formas como dependencia transitiva de httpx, pero eso es una casualidad, no
    # un contrato: si httpx dejara de necesitarlo, el CronJob de Cacles reventaría al arrancar.
    "certifi",
    "psycopg[binary]>=3.2",
    # Navegador headless para tiendas tras anti-bot (Akamai): ejecuta el sensor JS y
    # obtiene cookies válidas. Lo usan Sfera e Hipercor; el binario de Chromium se instala
    # aparte (`playwright install chromium`, ya en `just setup` y en el Dockerfile).
    #
    # Techo a propósito, por el mismo motivo que el de httpx y no por el que parece. Lo que se
    # ve primero es la fricción local: cada versión de playwright pide un build concreto de
    # Chromium, los builds se comparten entre venvs en `~/.cache/ms-playwright`, y sin techo un
    # venv nuevo instala una versión que pide un build que no está cacheado — así que Sfera e
    # Hipercor mueren pidiendo `playwright install` mientras `just check` sigue verde, porque
    # los tests de parseo son herméticos (#91). Eso lo arregla el `playwright install` de
    # `just setup`.
    # El techo está por lo otro: **una versión nueva de Chromium cambia la huella del navegador**,
    # y las dos tiendas que lo usan están detrás de Akamai. Sin techo, un `docker build` cualquier
    # día se lleva esa huella nueva al cluster sin que nadie la mire. Con techo, el bump es un PR
    # donde toca re-verificar (`python -m scraper.vigia --retailer sfera hipercor`).
    "playwright>=1.49,<1.62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
scraper = "scraper.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scraper"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
