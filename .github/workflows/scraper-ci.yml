name: scraper-ci

on:
  push:
    branches: [main]
    paths: ["services/scraper/**", "db/migrations/**", ".github/workflows/scraper-ci.yml"]
  pull_request:
    paths: ["services/scraper/**", "db/migrations/**", ".github/workflows/scraper-ci.yml"]

defaults:
  run:
    working-directory: services/scraper

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealtracker
          POSTGRES_PASSWORD: dealtracker
          POSTGRES_DB: deal_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealtracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dealtracker:dealtracker@localhost:5432/deal_tracker_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install .[dev]
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formato)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (incluye ingesta contra Postgres)
        run: pytest

  image:
    name: build & push (multiarch)
    runs-on: ubuntu-latest
    needs: lint-type-test
    permissions:
      contents: read
      packages: write
    env:
      # GHCR exige minúsculas en la ruta del owner.
      IMAGE: ghcr.io/liontech-solution/deal-tracker-scraper
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        # Solo publicamos desde main; en los PR el build es solo validación (no push).
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multiarch (push solo en main)
        uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo (la imagen necesita db/migrations).
          context: .
          file: services/scraper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Retención de imágenes en GHCR (conserva las 10 últimas)
        if: github.event_name == 'push'
        continue-on-error: true # la limpieza nunca debe tumbar la publicación
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: liontech-solution
          packages: deal-tracker-scraper
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
