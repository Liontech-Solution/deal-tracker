name: web-ci

on:
  push:
    branches: [main]
    paths: ["services/web/**", "db/migrations/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["services/web/**", "db/migrations/**", ".github/workflows/web-ci.yml"]

defaults:
  run:
    working-directory: services/web

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealtracker
          POSTGRES_PASSWORD: dealtracker
          POSTGRES_DB: deal_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealtracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dealtracker:dealtracker@localhost:5432/deal_tracker_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Habilitar pnpm (Corepack)
        run: corepack enable
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: ESLint (API)
        run: pnpm lint
      - name: Typecheck API (tsc)
        run: pnpm typecheck
      - name: Tests (incluye integración contra Postgres)
        run: pnpm test
      - name: ESLint (SPA)
        run: pnpm --filter @deal-tracker/frontend lint
      - name: Typecheck SPA (tsc)
        run: pnpm --filter @deal-tracker/frontend typecheck
      - name: Build SPA (vite)
        run: pnpm --filter @deal-tracker/frontend build
      - name: Auditoría de dependencias
        # No bloqueante al principio; sirve de alerta temprana de vulnerabilidades.
        continue-on-error: true
        run: pnpm audit --audit-level=high

  image:
    name: build & push (multiarch)
    runs-on: ubuntu-latest
    needs: lint-type-test
    permissions:
      contents: read
      packages: write
    env:
      # GHCR exige minúsculas en la ruta del owner.
      IMAGE: ghcr.io/liontech-solution/deal-tracker-web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        # Solo publicamos desde main; en los PR el build es solo validación (no push).
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multiarch (push solo en main)
        uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo (la imagen necesita db/migrations).
          context: .
          file: services/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Retención de imágenes en GHCR (conserva las 10 últimas)
        if: github.event_name == 'push'
        continue-on-error: true # la limpieza nunca debe tumbar la publicación
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: liontech-solution
          packages: deal-tracker-web
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
