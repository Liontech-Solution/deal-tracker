name: web-ci

on:
  push:
    branches: [main]
    paths: ["services/web/**", "db/migrations/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["services/web/**", "db/migrations/**", ".github/workflows/web-ci.yml"]

# Un push nuevo a una rama con PR abierto cancela el run anterior: nadie va a mirar ese build y
# cuesta minutos de Actions. En main NO se cancela — ese run es el que publica la imagen en GHCR
# y dispara el bump de GitOps; abortarlo a medias dejaría el despliegue a medio camino.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: services/web

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealtracker
          POSTGRES_PASSWORD: dealtracker
          POSTGRES_DB: deal_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealtracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dealtracker:dealtracker@localhost:5432/deal_tracker_test
      # Segunda base, con el ctype de la del cluster. Ver el paso que la crea, más abajo.
      TEST_DATABASE_URL_CTYPE_C: postgresql://dealtracker:dealtracker@localhost:5432/deal_tracker_ctype_c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Habilitar pnpm (Corepack)
        run: corepack enable
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      # NO SOBRA, aunque parezca la misma base dos veces (#105). El servicio de arriba levanta
      # `postgres:16-alpine` con su locale por defecto, y ahí `lower('ÍNDIGO')` devuelve 'índigo';
      # la base del cluster está creada con ctype `C`, donde devuelve 'Índigo' y NO baja las letras
      # acentuadas. Por eso `size_canon`, `color_canon` y el plegado de la búsqueda salían en verde
      # aquí mientras en el cluster dejaban 748 variantes con la canónica a medias y dos chips
      # partidos en la faceta. Los specs de canónica y de búsqueda se ejecutan contra las DOS.
      # `TEMPLATE template0` es obligatorio para crear una base con otro locale.
      - name: Base con ctype C (reproduce la del cluster)
        env:
          PGPASSWORD: dealtracker
        run: |
          psql -h localhost -U dealtracker -d deal_tracker_test -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE deal_tracker_ctype_c TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C';"
      - name: ESLint (API)
        run: pnpm lint
      - name: Typecheck API (tsc)
        run: pnpm typecheck
      - name: Tests (incluye integración contra Postgres)
        run: pnpm test
      - name: ESLint (SPA)
        run: pnpm --filter @deal-tracker/frontend lint
      - name: Typecheck SPA (tsc)
        run: pnpm --filter @deal-tracker/frontend typecheck
      - name: Build SPA (vite)
        run: pnpm --filter @deal-tracker/frontend build
      - name: Auditoría de dependencias
        # No bloqueante al principio; sirve de alerta temprana de vulnerabilidades.
        continue-on-error: true
        run: pnpm audit --audit-level=high

  image:
    name: build & push (multiarch en main)
    runs-on: ubuntu-latest
    needs: lint-type-test
    permissions:
      contents: read
      packages: write
    env:
      # GHCR exige minúsculas en la ruta del owner.
      IMAGE: ghcr.io/liontech-solution/deal-tracker-web
    # Tag inmutable (sha-<corto>) que consume el bump de GitOps; nunca "latest".
    outputs:
      deploytag: ${{ steps.deploytag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag de despliegue (sha corto, inmutable)
        id: deploytag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      # QEMU solo hace falta para emular arm64, y arm64 solo se compila en main (ver más abajo).
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        # Solo publicamos desde main; en los PR el build es solo validación (no push).
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Build — main: multiarch y publica / PR: solo amd64 (validación)"
        uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo (la imagen necesita db/migrations).
          context: .
          file: services/web/Dockerfile
          # En un PR el build no se publica: solo comprueba que el Dockerfile sigue construyendo,
          # que las dependencias resuelven y que el contexto es correcto. Eso ya lo prueba amd64,
          # y el arm64 emulado por QEMU costaba ~8 min para tirarlos a la basura (#61).
          # main SIEMPRE multiarch: el cluster son Raspberry Pi (arm64) y sin esa variante no
          # arranca nada. Si arm64 rompe, este job falla y el bump no reescribe el newTag.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.deploytag.outputs.tag }}
          cache-from: type=gha
          # Solo main escribe caché. Lo que escribe un PR solo lo ve ese mismo PR (Actions aísla
          # la caché por rama), pero sí gasta de los 10 GB del repo y desaloja por LRU la caché
          # multiarch de main, que es la que leen todos los PR. mode=max porque las stages caras
          # son intermedias (deps/build-api/build-frontend).
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      # `keep-n-tagged` cuenta SOLO las versions no excluidas, así que esto acota la cola de
      # `sha-<7>` y nada más: cada `release-qa` añade un `v*` a una version y la saca del ciclo de
      # poda para siempre. Medido el 14/08/2026 en #283: de 24 versions con tag del web, 13 son ya
      # inmunes, y esa fracción solo sube (+1 por release, nunca baja).
      #
      # POR QUÉ 30 Y NO 10, que es con lo que nació esto en el primer CI: la ventana de `sha-<7>`
      # ES la ventana de rollback de dev, el único entorno que corre un sha. Con 10 y el ritmo real
      # de los últimos 7 días —26 publicaciones de esta imagen, la más movida de las dos— dev no
      # podía volver a lo que corría hace TRES días, y en una versión con sesiones en paralelo es
      # bastante peor. 30 da del orden de una semana aquí y dos en el scraper. Pasado ese umbral la
      # imagen YA NO EXISTE y dev no tiene rollback: es una decisión escrita, no un olvido.
      - name: Retención de imágenes en GHCR (conserva las 30 últimas)
        id: retencion
        if: github.event_name == 'push'
        continue-on-error: true # la limpieza nunca debe tumbar la publicación
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: liontech-solution
          packages: deal-tracker-web
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-n-tagged: 30
          # Protege 'latest' y los tags de release semver (v*) que consume QA/prod de la poda. NO
          # se toca: la ventana de `v*` que sobreviva ES la ventana de rollback de prod, cuyo
          # overlay pinta un tag y no un digest. Y si algún día se poda, ojo — GHCR borra
          # *versions*, no tags, y aquí mismo la version 1106121923 carga `v0.1.8` Y `v0.1.9`, que
          # es la que sirvió prod: podar «la vieja» se lleva la buena por delante (#283).
          exclude-tags: latest,v*
          delete-untagged: true

      # Qué tag ha salido de este run, sin abrir la traza. Y sobre todo la distinción de #61 dicha
      # en voz alta: en un PR esto NO publica nada, así que un check verde no prueba que la imagen
      # arm64 que el cluster necesita exista.
      - name: Resumen del run
        if: always()
        # La raíz, no el `working-directory` que fija el `defaults` de este workflow: con
        # `if: always()` esto también corre cuando el checkout no llegó a hacerse, y un cwd que no
        # existe mata el paso antes de escribir nada.
        working-directory: .
        env:
          TAG: ${{ steps.deploytag.outputs.tag }}
          RETENCION: ${{ steps.retencion.outcome }}
        run: |
          {
            echo "## Imagen"
            echo
            if [ "${{ job.status }}" != "success" ]; then
              echo "- ❌ El build ha fallado: no hay imagen nueva."
            elif [ "${{ github.event_name }}" = "push" ]; then
              echo "- Publicada \`$IMAGE:$TAG\` en GHCR, multiarch (amd64 + arm64)."
              # La retención lleva `continue-on-error` a propósito —la limpieza nunca debe tumbar la
              # publicación—, y la consecuencia es que su fallo no pinta nada de rojo en ningún sitio.
              if [ "$RETENCION" = "failure" ]; then
                echo "- ⚠️ La retención de GHCR ha fallado (no tumba la publicación, por diseño)."
              fi
            else
              echo "- PR: build de validación **solo amd64 y sin publicar**. La variante arm64 que el cluster necesita no existe hasta que esto entre en \`main\` (#61)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Bump GitOps: reescribe images[].newTag de deal-tracker-web en el repo de manifiestos
  # (juanjocop/k3s-local-apps-manifests) → ArgoCD auto-sincroniza en el cluster dev.
  # Gated por la variable de repo ENABLE_BUMP=true (requiere el secret GITOPS_PAT).
  bump:
    name: bump GitOps (dev)
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && vars.ENABLE_BUMP == 'true'
    steps:
      - name: Checkout repo de manifiestos (GitOps)
        uses: actions/checkout@v5
        with:
          repository: juanjocop/k3s-local-apps-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
      - name: Reescribir images[].newTag (deal-tracker-web)
        uses: mikefarah/yq@v4.44.3
        env:
          NEW_TAG: ${{ needs.image.outputs.deploytag }}
          IMG_NAME: ghcr.io/liontech-solution/deal-tracker-web
        with:
          cmd: yq -i '(.images[] | select(.name == strenv(IMG_NAME)).newTag) = strenv(NEW_TAG)' gitops/deal-tracker/overlays/dev/kustomization.yaml
      - name: Commit y push al repo de manifiestos
        working-directory: gitops
        env:
          NEW_TAG: ${{ needs.image.outputs.deploytag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deal-tracker/overlays/dev/kustomization.yaml
          printf '## GitOps (dev)\n\n' >> "$GITHUB_STEP_SUMMARY"
          git commit -m "chore: deal-tracker-web ${NEW_TAG}" || {
            echo "sin cambios"
            echo "- ℹ️ El overlay de dev ya apuntaba a \`${NEW_TAG}\`: no hay commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          git push
          echo "- **dev bumpeado a \`${NEW_TAG}\`** → [commit de GitOps](https://github.com/juanjocop/k3s-local-apps-manifests/commit/$(git rev-parse HEAD)) · ArgoCD sincroniza" >> "$GITHUB_STEP_SUMMARY"
