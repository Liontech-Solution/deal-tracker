name: release-prod
# El título del run en la lista de Actions: sin esto todos los runs se llaman igual y hay que
# entrar en cada uno para ver qué versión movió (o intentó mover).
run-name: release-prod ${{ inputs.version }} → producción

# Promoción a PRODUCCIÓN de una versión semver que ya corre en QA.
#
# OJO, esto NO es un release-qa apuntando a otro overlay: aquí no se promociona ninguna imagen.
# release-qa tiene trabajo que hacer porque dev corre `sha-<7>` y QA necesita un `vX.Y.Z`, así que
# copia la manifest list al mismo digest. Prod consume EXACTAMENTE el mismo tag `vX.Y.Z` que QA ya
# está corriendo: no hay nada que re-etiquetar, y por eso no hay `imagetools create`.
#
# Lo que este workflow es de verdad es un GATE. Su valor entero está en los cinco pasos de
# verificación —el GATE 0 se añadió en #306 y es el único que mira la DIRECCIÓN del movimiento—,
# y el que importa es el del informe:
#
#   La autoridad de que una versión vale para producción es `.claude/qa-reports/<version>.md`,
#   commiteado en este repo, que empieza por `**Veredicto: APTO**`. NO el flag `prerelease` de
#   GitHub, que lo cambia cualquiera con dos clics y no deja rastro en ningún sitio.
#
# El flag se asciende aquí (y en `/validar-qa` al escribir un informe APTO) para poder ver de un
# vistazo cuál pasó, pero es la señal, nunca la decisión. Consecuencia buscada: una versión que se
# cortó en QA y no se validó nunca no tiene informe, así que este workflow la rechaza — se queda
# fuera de producción por no haber sido mirada, que es el comportamiento correcto.
#
# LA RUTA `deal-tracker/overlays/prod` DEL REPO DE MANIFIESTOS ES CONTRATO ENTRE LOS DOS REPOS.
# Si allí se renombra el directorio, aquí el bump falla. Está dicho también en el propio
# kustomization.yaml de prod y en k3s-local-apps-manifests#86.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver a promover a producción (p.ej. v0.1.9)"
        required: true
        type: string

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  promote:
    name: promote QA → prod (vX.Y.Z)
    runs-on: ubuntu-latest
    permissions:
      contents: write # ascender el GitHub Release de prerelease a release
      packages: read # comprobar que las imágenes existen en GHCR
    env:
      WEB_IMAGE: ghcr.io/liontech-solution/deal-tracker-web
      SCRAPER_IMAGE: ghcr.io/liontech-solution/deal-tracker-scraper
      # Kustomization de QA (fuente: "lo que QA ha estado corriendo") y de prod (destino del bump).
      QA_KUSTOMIZATION: gitops/deal-tracker/overlays/qa/kustomization.yaml
      PROD_KUSTOMIZATION: gitops/deal-tracker/overlays/prod/kustomization.yaml
    steps:
      - name: Validar que se lanza desde main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::release-prod solo se lanza desde main (ref actual: ${{ github.ref }})"
            exit 1
          fi

      - name: Validar formato de versión (semver vX.Y.Z)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versión inválida: '$VERSION'. Formato esperado: vX.Y.Z (p.ej. v0.1.9)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Cabecera del resumen del run. De aquí en adelante cada gate escribe su línea SEGÚN PASA,
          # no al final: los cinco cortan por motivos distintos, y así cuál cortó se lee en la
          # cabecera del run sin abrir una sola traza.
          printf '# release-prod %s\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------- GATE 0: prod solo avanza, y solo hacia lo real
      # Barato y sin checkouts, para que falle en cinco segundos. Tapa lo único que NINGÚN otro gate
      # mira: la dirección. Hasta #306 la versión llegaba de un campo de texto libre, y `v0.1.8`
      # tecleada por error habría pasado los cuatro gates el día que tuviera informe APTO — un
      # downgrade silencioso de producción.
      #
      # OJO, DOS MATICES QUE NO SON DECORATIVOS:
      #
      #   1. Es `>=` y no `>` A PROPÓSITO. Relanzar este workflow sobre la versión que prod ya corre
      #      es un caso real y soportado (ver el paso de ascenso del Release, más abajo: el estreno
      #      fue con `v0.1.9`, ya desplegada). Un `>` estricto rompería esa idempotencia sin ganar
      #      nada: el rollback sigue bloqueado igual.
      #   2. EL GATE 0 NO SUSTITUYE AL GATE 1. Aquí se mira el flag `prerelease`, y la cabecera de
      #      este workflow es explícita en que ese flag es la señal y nunca la decisión — lo cambia
      #      cualquiera con dos clics y no deja rastro. La autoridad sigue siendo el informe
      #      commiteado. Esto solo descarta rápido lo que ni siquiera merece que se clone el repo.
      #
      # Para rollbacks se decidirá otro camino: este workflow solo va hacia adelante, y desde #306
      # eso está escrito y comprobado, no supuesto.
      - name: Exigir Release publicada y que no sea un downgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # El motivo se escribe una vez en `msg` y se usa dos —resumen y anotación— para que no
          # puedan desincronizarse.
          corta() {
            echo "- ❌ **GATE 0** — $1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          if ! release=$(gh release view "$VERSION" --repo "$REPO" --json isPrerelease,isDraft 2>/dev/null); then
            corta "$VERSION no tiene GitHub Release. ¿Llegó a lanzarse el release-qa de esta versión?"
          fi
          if [ "$(echo "$release" | jq -r .isDraft)" = "true" ]; then
            corta "El Release de $VERSION es un borrador: no ha llegado a publicarse."
          fi
          if [ "$(echo "$release" | jq -r .isPrerelease)" = "true" ]; then
            corta "$VERSION sigue en prerelease: o no se validó, o su informe no dio APTO. El GATE 1 lo confirmará, pero no hace falta llegar hasta allí."
          fi

          latest=$(gh api "repos/$REPO/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "- ⚠️ **GATE 0** — $VERSION es release publicada, pero no hay ninguna marcada como \`latest\`: la dirección del movimiento queda sin comprobar." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No hay ninguna release marcada como latest; no puedo comprobar la dirección. Sigo."
            exit 0
          fi
          # sort -V ordena por semver (v0.10.0 > v0.4.0, que es donde una comparación de texto
          # se equivocaría). Si la mayor de las dos no es la que se pide, se va hacia atrás.
          if [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            corta "$VERSION es anterior a la latest actual ($latest). release-prod solo avanza: para volver atrás hace falta otro camino, y no es este workflow."
          fi
          echo "$VERSION es release publicada y >= latest ($latest)"
          echo "- ✅ **GATE 0** — Release publicada y $VERSION ≥ latest ($latest)" >> "$GITHUB_STEP_SUMMARY"

      # Este repo primero: `actions/checkout` limpia su destino, y el segundo checkout cuelga
      # dentro del árbol del primero (gitops/).
      - name: Checkout de este repo (trae los informes de validación)
        uses: actions/checkout@v5

      - name: Checkout repo de manifiestos (GitOps)
        uses: actions/checkout@v5
        with:
          repository: juanjocop/k3s-local-apps-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      # ---------------------------------------------------------------- GATE 1: el informe manda
      - name: Exigir informe de validación con veredicto APTO
        run: |
          set -euo pipefail
          corta() {
            echo "- ❌ **GATE 1** — $1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }
          informe=".claude/qa-reports/$VERSION.md"
          if [ ! -f "$informe" ]; then
            corta "No existe $informe. Una versión sin validar no va a producción: pasa /validar-qa $VERSION y commitea su informe."
          fi
          # El veredicto es la primera línea con el formato `**Veredicto: X**` (informe-plantilla.md).
          # Se extrae y se compara ENTERO a propósito: un `grep APTO` a secas también casa con
          # "NO APTO", que es justo el caso que hay que rechazar.
          veredicto=$(grep -m1 -oP '^\*\*Veredicto: \K[^*]+(?=\*\*$)' "$informe" || true)
          if [ -z "$veredicto" ]; then
            corta "$informe no declara veredicto en el formato '**Veredicto: X**' de informe-plantilla.md"
          fi
          if [ "$veredicto" != "APTO" ]; then
            corta "$informe dice '$veredicto', no APTO. NO APTO y NO CONCLUYENTE bloquean igual: ninguno es un aprobado."
          fi
          echo "$informe → APTO"
          echo "- ✅ **GATE 1** — [\`$informe\`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$informe) → **APTO**" >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------- GATE 2: QA tuvo que correr esa versión
      - name: Exigir que QA esté corriendo esa versión
        run: |
          set -euo pipefail
          qa_web=$(WEB_IMAGE="$WEB_IMAGE" yq '.images[] | select(.name == strenv(WEB_IMAGE)).newTag' "$QA_KUSTOMIZATION")
          qa_scraper=$(SCRAPER_IMAGE="$SCRAPER_IMAGE" yq '.images[] | select(.name == strenv(SCRAPER_IMAGE)).newTag' "$QA_KUSTOMIZATION")
          if [ "$qa_web" != "$VERSION" ] || [ "$qa_scraper" != "$VERSION" ]; then
            msg="QA corre web=$qa_web scraper=$qa_scraper, no $VERSION. El informe se emitió sobre lo desplegado en QA; si QA ya no lo corre, no se promueve."
            echo "- ❌ **GATE 2** — $msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
          echo "QA corre $VERSION en las dos imágenes"
          echo "- ✅ **GATE 2** — QA corre $VERSION en las dos imágenes" >> "$GITHUB_STEP_SUMMARY"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------- GATE 3: los artefactos siguen existiendo
      - name: Comprobar que las imágenes vX.Y.Z existen en GHCR
        run: |
          set -euo pipefail
          for image in "$WEB_IMAGE" "$SCRAPER_IMAGE"; do
            if ! docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              msg="No existe $image:$VERSION en GHCR — ¿llegó a lanzarse el release-qa de esta versión?"
              echo "- ❌ **GATE 3** — $msg" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$msg"
              exit 1
            fi
            echo "ok $image:$VERSION"
          done
          echo "- ✅ **GATE 3** — las dos imágenes \`$VERSION\` siguen en GHCR" >> "$GITHUB_STEP_SUMMARY"

      - name: Ascender el GitHub Release (prerelease → release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" \
            --repo "${{ github.repository }}" \
            --prerelease=false \
            --latest
          echo "- **Release ascendido a \`latest\`:** https://github.com/${{ github.repository }}/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          # Deja escrito en las notas de dónde salió la aprobación, para que la release apunte al
          # informe y no solo al revés. Idempotente: relanzar el workflow sobre la misma versión
          # (que es un caso real — el estreno fue con v0.1.9, ya desplegada) no apila coletillas.
          gh release view "$VERSION" --repo "${{ github.repository }}" --json body -q .body > /tmp/notas.md
          if grep -q '^\*\*Promocionada a producción\*\*' /tmp/notas.md; then
            echo "las notas ya recogen la promoción; no las toco"
            exit 0
          fi
          {
            echo
            echo "---"
            echo
            echo "**Promocionada a producción** el $(date -u '+%d/%m/%Y') por \`release-prod\`."
            echo "Aprobada por \`.claude/qa-reports/$VERSION.md\` (**Veredicto: APTO**)."
          } >> /tmp/notas.md
          gh release edit "$VERSION" --repo "${{ github.repository }}" --notes-file /tmp/notas.md

      - name: Auto-bump del overlay de prod
        run: |
          set -euo pipefail
          if [ ! -f "$PROD_KUSTOMIZATION" ]; then
            msg="No existe $PROD_KUSTOMIZATION. Esa ruta es contrato con el repo de manifiestos (k3s-local-apps-manifests#86); si el overlay se ha renombrado, hay que arreglarlo aquí."
            echo "- ❌ **El bump de prod no se ha hecho** — $msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
          # Lo que prod corría ANTES de que el `yq -i` de abajo lo pise. Es el dato que contesta «¿de
          # qué versión venimos?», y una vez reescrito el fichero ya no está en ningún sitio: ni el
          # Release, ni los gates, ni el commit de GitOps lo dicen.
          prod_previa=$(WEB_IMAGE="$WEB_IMAGE" yq '.images[] | select(.name == strenv(WEB_IMAGE)).newTag' "$PROD_KUSTOMIZATION")
          if [ -z "$prod_previa" ] || [ "$prod_previa" = "null" ]; then
            # No corta: aquí ya está todo verificado y el bump debe seguir. Solo se dice que no se
            # ha podido leer, en vez de escribir un «prod: → vX.Y.Z» que parece un dato.
            prod_previa="(sin leer)"
          fi
          # yq (mikefarah v4) viene preinstalado en los runners ubuntu-latest.
          WEB_IMAGE="$WEB_IMAGE" VERSION="$VERSION" yq -i \
            '(.images[] | select(.name == strenv(WEB_IMAGE)).newTag) = strenv(VERSION)' "$PROD_KUSTOMIZATION"
          SCRAPER_IMAGE="$SCRAPER_IMAGE" VERSION="$VERSION" yq -i \
            '(.images[] | select(.name == strenv(SCRAPER_IMAGE)).newTag) = strenv(VERSION)' "$PROD_KUSTOMIZATION"
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PROD_KUSTOMIZATION#gitops/}"
          git commit -m "chore(prod): deal-tracker $VERSION" || {
            echo "sin cambios: prod ya corría $VERSION"
            echo "- ℹ️ **prod ya corría $VERSION** — el overlay no ha cambiado, no hay commit de GitOps." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          git push
          echo "- **prod: $prod_previa → $VERSION** · [commit de GitOps](https://github.com/juanjocop/k3s-local-apps-manifests/commit/$(git rev-parse HEAD)) · ArgoCD sincroniza" >> "$GITHUB_STEP_SUMMARY"

      # El resumen lo han ido escribiendo los gates de arriba; esto solo lo cierra. Va con
      # `if: always()` para que un corte también quede rotulado —que es el caso frecuente aquí— y
      # NO PUEDE FALLAR: si fallara convertiría un fallo atribuido en dos.
      - name: Cerrar el resumen del run
        if: always()
        # Por env y no interpolado en el `run:`: `inputs.version` es texto libre, y ${{ }} dentro de
        # un script se sustituye ANTES de que lo vea bash. Es el mismo motivo por el que el paso que
        # valida el formato ya lo recibe así.
        env:
          VERSION_PEDIDA: ${{ inputs.version }}
        run: |
          {
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **$VERSION está en producción.**"
            else
              echo "❌ **$VERSION_PEDIDA NO se ha promovido a producción** (\`${{ job.status }}\`). La línea en rojo de arriba dice qué cortó; prod sigue como estaba."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
