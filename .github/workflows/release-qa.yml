name: release-qa
# El título del run en la lista de Actions. Sin esto los `workflow_dispatch` se llaman todos
# igual y la versión —el único dato que los distingue— hay que ir a buscarla dentro de cada run.
run-name: release-qa ${{ inputs.version }} (dev → QA)

# Promoción a QA por versión semver. NO reconstruye: toma los sha-<7> que dev corre hoy (leídos
# del repo de manifiestos) y les añade el tag vX.Y.Z al MISMO digest con `imagetools create`
# (multiarch, sin rebuild). Luego crea un GitHub Release (prerelease) y auto-bumpea el overlay de
# QA en el repo de manifiestos → ArgoCD QA sincroniza. El gate humano es lanzar este workflow.
#
# "Build once, promote many": el artefacto de QA es exactamente el que dev ya observó.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver a publicar (p.ej. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-qa
  cancel-in-progress: false

jobs:
  promote:
    name: promote dev → QA (vX.Y.Z)
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear tag + GitHub Release
      packages: write # re-etiquetar imágenes en GHCR
    env:
      WEB_IMAGE: ghcr.io/liontech-solution/deal-tracker-web
      SCRAPER_IMAGE: ghcr.io/liontech-solution/deal-tracker-scraper
      # Kustomization de dev (fuente de "lo que corre dev") y de QA (destino del auto-bump).
      # La ruta de QA la fija el repo de manifiestos (ver k3s-local-apps-manifests#32): el bump
      # tolera que aún no exista (loguea y salta) para no romper el release.
      DEV_KUSTOMIZATION: gitops/deal-tracker/overlays/dev/kustomization.yaml
      QA_KUSTOMIZATION: gitops/deal-tracker/overlays/qa/kustomization.yaml
    steps:
      - name: Validar que se lanza desde main
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::release-qa solo se lanza desde main (ref actual: ${{ github.ref }})"
            exit 1
          fi

      - name: Validar formato de versión (semver vX.Y.Z)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versión inválida: '$VERSION'. Formato esperado: vX.Y.Z (p.ej. v0.1.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Cabecera del resumen del run. De aquí en adelante cada paso escribe su línea SEGÚN PASA,
          # no al final: así un corte a mitad deja escrito hasta dónde se llegó sin tener que
          # arrastrar el motivo entre pasos por $GITHUB_ENV.
          printf '# release-qa %s\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repo de manifiestos (GitOps)
        uses: actions/checkout@v5
        with:
          repository: juanjocop/k3s-local-apps-manifests
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Descubrir qué corre dev (sha-<7> por imagen)
        # yq (mikefarah v4) viene preinstalado en los runners ubuntu-latest.
        run: |
          set -euo pipefail
          web_sha=$(WEB_IMAGE="$WEB_IMAGE" yq '.images[] | select(.name == strenv(WEB_IMAGE)).newTag' "$DEV_KUSTOMIZATION")
          scraper_sha=$(SCRAPER_IMAGE="$SCRAPER_IMAGE" yq '.images[] | select(.name == strenv(SCRAPER_IMAGE)).newTag' "$DEV_KUSTOMIZATION")
          if [ -z "$web_sha" ] || [ "$web_sha" = "null" ] || [ -z "$scraper_sha" ] || [ "$scraper_sha" = "null" ]; then
            echo "::error::No pude leer los newTag de dev (web='$web_sha' scraper='$scraper_sha') en $DEV_KUSTOMIZATION"
            exit 1
          fi
          echo "WEB_SHA=$web_sha" >> "$GITHUB_ENV"
          echo "SCRAPER_SHA=$scraper_sha" >> "$GITHUB_ENV"
          echo "dev corre → web=$web_sha, scraper=$scraper_sha"

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promocionar imágenes (añadir vX.Y.Z al mismo digest)
        run: |
          set -euo pipefail
          promote() {
            local image="$1" sha="$2"
            echo "::group::$image  $sha → $VERSION"
            # Gate: el digest de origen tiene que existir (si no, CI aún no lo publicó).
            if ! docker buildx imagetools inspect "$image:$sha" >/dev/null 2>&1; then
              # El mensaje se escribe una vez y se usa dos, para que el resumen y la anotación no
              # se desincronicen.
              msg="No existe $image:$sha en GHCR — ¿ha terminado el CI de ese commit?"
              printf '\n❌ **No se promociona nada** — %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$msg"
              exit 1
            fi
            # Copia la manifest list multiarch por digest: sin pull ni rebuild.
            docker buildx imagetools create --tag "$image:$VERSION" "$image:$sha"
            echo "::endgroup::"
          }
          promote "$WEB_IMAGE" "$WEB_SHA"
          promote "$SCRAPER_IMAGE" "$SCRAPER_SHA"
          {
            echo "| imagen | sha de origen (lo que corría dev) | tag publicado |"
            echo "|---|---|---|"
            echo "| \`$WEB_IMAGE\` | \`$WEB_SHA\` | \`$VERSION\` |"
            echo "| \`$SCRAPER_IMAGE\` | \`$SCRAPER_SHA\` | \`$VERSION\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Crear GitHub Release (prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Release de QA (prerelease). Promocionado desde los artefactos que **dev** corría, sin rebuild.

          | imagen | digest de origen | tag publicado |
          |---|---|---|
          | \`$WEB_IMAGE\` | \`$WEB_SHA\` | \`$VERSION\` |
          | \`$SCRAPER_IMAGE\` | \`$SCRAPER_SHA\` | \`$VERSION\` |

          Commit de referencia: ${{ github.sha }}
          EOF
          )
          # `gh release create` imprime la URL del Release en stdout: se recoge para enlazarla.
          url=$(gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --prerelease \
            --notes "$notes")
          echo "- **Release (prerelease):** $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-bump del overlay de QA (si existe)
        run: |
          set -euo pipefail
          if [ ! -f "$QA_KUSTOMIZATION" ]; then
            echo "- ⚠️ **QA NO se ha bumpeado** — no existe \`$QA_KUSTOMIZATION\` en el repo de manifiestos. La imagen $VERSION está publicada, pero el cluster de QA sigue en lo que ya corría." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$QA_KUSTOMIZATION aún no existe — salto el bump de QA. Créalo en el repo de manifiestos (k3s-local-apps-manifests#32) y el próximo release lo bumpeará."
            exit 0
          fi
          # yq (mikefarah) preinstalado en el runner. Reescribe el newTag de ambas imágenes.
          WEB_IMAGE="$WEB_IMAGE" VERSION="$VERSION" yq -i \
            '(.images[] | select(.name == strenv(WEB_IMAGE)).newTag) = strenv(VERSION)' "$QA_KUSTOMIZATION"
          SCRAPER_IMAGE="$SCRAPER_IMAGE" VERSION="$VERSION" yq -i \
            '(.images[] | select(.name == strenv(SCRAPER_IMAGE)).newTag) = strenv(VERSION)' "$QA_KUSTOMIZATION"
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${QA_KUSTOMIZATION#gitops/}"
          git commit -m "chore(qa): deal-tracker $VERSION" || {
            echo "sin cambios"
            echo "- ℹ️ **QA ya corría $VERSION** — el overlay no ha cambiado, no hay commit de GitOps." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          git push
          echo "- **QA bumpeado** → [\`$(git rev-parse --short HEAD)\`](https://github.com/juanjocop/k3s-local-apps-manifests/commit/$(git rev-parse HEAD)) · ArgoCD sincroniza QA a $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # El resumen lo han ido escribiendo los pasos de arriba; esto solo lo cierra. Va con
      # `if: always()` para que un corte a mitad también quede rotulado, y NO PUEDE FALLAR: si
      # fallara convertiría un fallo atribuido en dos.
      - name: Cerrar el resumen del run
        if: always()
        # Por env y no interpolado en el `run:`: `inputs.version` es texto libre, y ${{ }} dentro de
        # un script se sustituye ANTES de que lo vea bash. Es el mismo motivo por el que el paso que
        # valida el formato ya lo recibe así.
        env:
          VERSION_PEDIDA: ${{ inputs.version }}
        run: |
          {
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **$VERSION promocionada a QA.** Queda \`/validar-qa $VERSION\` y commitear su informe: sin él, \`release-prod\` la rechaza."
            else
              echo "❌ **release-qa $VERSION_PEDIDA no ha terminado** (\`${{ job.status }}\`). Lo escrito arriba es hasta dónde llegó."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # La versión que acaba de nacer es la enésima `prerelease` viva, y hasta #306 no se borraba
  # ninguna nunca. Se poda justo aquí porque es el momento exacto en que nace una, igual que los dos
  # CI limpian GHCR justo después de publicar la imagen. El techo y el suelo, y por qué las
  # no-`prerelease` no se tocan, están en el propio `prune-prereleases.yml`.
  #
  # Va como job aparte y no como paso porque el mismo workflow se lanza a mano por
  # `workflow_dispatch` para vaciar el atraso: es el MISMO código, no una copia que se desincroniza.
  # Que `promote` haya terminado bien es lo único que exige.
  limpieza:
    name: podar prereleases viejas
    needs: promote
    permissions:
      contents: write
    uses: ./.github/workflows/prune-prereleases.yml
